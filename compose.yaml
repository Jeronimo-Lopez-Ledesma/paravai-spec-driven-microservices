services:
  mongodb:
    image: mongo:8.0.30
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - communities-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  communities-data:
